<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="hsl(250, 35%, 20%)"/>
      <stop offset="100%" stop-color="hsl(230, 25%, 8%)"/>
    </radialGradient>
  </defs>
  <!-- Space background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="12" cy="14" r="1.3" fill="#fff" opacity="0.9"/>
  <circle cx="52" cy="12" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="50" cy="50" r="1.4" fill="#fff" opacity="0.85"/>
  <circle cx="14" cy="48" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="40" cy="9" r="0.8" fill="hsl(40, 95%, 55%)" opacity="0.9"/>
  <!-- Satellite -->
  <g>
    <!-- Solar panels -->
    <rect x="6" y="29" width="13" height="10" rx="2" fill="hsl(190, 90%, 50%)" opacity="0.5"/>
    <rect x="45" y="29" width="13" height="10" rx="2" fill="hsl(190, 90%, 50%)" opacity="0.5"/>
    <!-- Body -->
    <rect x="21" y="24" width="22" height="19" rx="4" fill="hsl(190, 90%, 52%)"/>
    <rect x="26" y="29" width="12" height="9" rx="2" fill="#fff" opacity="0.35"/>
    <!-- Antenna -->
    <line x1="32" y1="24" x2="32" y2="13" stroke="hsl(270, 60%, 65%)" stroke-width="2"/>
    <circle cx="32" cy="11" r="3" fill="hsl(40, 95%, 55%)"/>
  </g>
</svg>
